[package]
name = "server"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-files = "0.6.10"
actix-web = { version = "4.18.1", features = ["macros"] }
leptos = { version = "0.9.0-rc0", features = ["ssr"] }
leptos_meta = { version = "0.9.0-rc0", features = ["ssr"] }
leptos_actix = { version = "0.9.0-rc0" }
serde = { version = "1.0.229", features = ["derive"] }
client = { path = "../client", default-features = false, features = ["ssr"] }
