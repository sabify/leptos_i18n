[package]
name = "interpolate"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos = { version = "0.9.0-rc0", features = ["csr"] }
leptos_meta = { version = "0.9.0-rc0" }
leptos_i18n = { path = "../../../leptos_i18n", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
console_error_panic_hook = { version = "0.1.7" }
wasm-bindgen = { version = "0.2.129" }

[build-dependencies.leptos_i18n_build]
path = "../../../leptos_i18n_build"
features = ["pretty_print", "csr"]
